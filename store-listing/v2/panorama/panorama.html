<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MachaX panorama 01-02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Brand tokens from store-listing/src/screens.html */
:root {
  --paper: #F4F1E8;
  --ink: #1E1C16;
  --matcha: #6BAE7E;
  --matcha-deep: #3E7A50;
  --matcha-dark: #2A5838;
  --matcha-light: #c8e6cc;
  --serif: "Fraunces", serif;
  --body: "Space Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", monospace;
  --hand: "Caveat", cursive;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; }

#spread {
  width: 2160px; height: 1920px; position: relative; overflow: hidden;
  color: var(--paper); font-family: var(--body);
  background:
    radial-gradient(1100px 900px at 8% 4%, rgba(200,230,204,0.30), transparent 70%),
    radial-gradient(900px 800px at 78% 52%, rgba(107,174,126,0.28), transparent 70%),
    radial-gradient(900px 700px at 100% 100%, rgba(20,45,28,0.55), transparent 70%),
    linear-gradient(160deg, #4A8A5C 0%, var(--matcha-deep) 40%, var(--matcha-dark) 100%);
}
/* film grain so the flat gradient doesn't feel like a template */
#spread::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .16; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- left half ---------- */
.logo { position: absolute; left: 96px; top: 112px; display: flex; align-items: center; gap: 14px;
  font-family: var(--serif); font-weight: 700; font-size: 56px; letter-spacing: -1.5px; }
.logo em { font-style: italic; color: var(--matcha-light); }

.hl { position: absolute; font-family: var(--serif); font-style: italic; font-weight: 700;
  letter-spacing: -5px; line-height: .9; color: var(--paper); }
.hl-left { left: 88px; top: 250px; font-size: 186px; }
.kicker { position: absolute; left: 96px; top: 640px; font-size: 46px; font-weight: 500;
  color: rgba(244,241,232,.85); }

/* the user's dilemma */
.you { position: absolute; left: 96px; top: 760px; width: 860px; transform: rotate(-3.5deg); transform-origin: 0 0; }
.you .who { font-family: var(--mono); font-size: 28px; letter-spacing: .06em; color: var(--matcha-light); margin: 0 0 14px 8px; }
.you .b { background: var(--paper); color: var(--ink); font-size: 66px; line-height: 1.12; font-weight: 600;
  padding: 40px 50px 44px; border-radius: 52px 52px 52px 14px;
  box-shadow: 0 40px 70px -30px rgba(0,0,0,.55); letter-spacing: -1px; }

/* the gang assembling */
.gang { position: absolute; left: 110px; top: 1150px; display: flex; }
.gang .av { width: 128px; height: 128px; font-size: 56px; border: 6px solid #3A7449; margin-left: -30px; }
.gang .av:first-child { margin-left: 0; }
.typing-note { position: absolute; left: 116px; top: 1300px; font-family: var(--mono); font-size: 32px;
  color: rgba(244,241,232,.85); display: flex; align-items: center; gap: 16px; }
.dots { display: inline-flex; gap: 8px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); opacity: .45; }
.dots i:nth-child(2) { opacity: 1; transform: translateY(-5px); }
.hand { position: absolute; font-family: var(--hand); font-weight: 700; color: var(--matcha-light); }
.hand-left { left: 150px; top: 1640px; font-size: 64px; transform: rotate(-4deg); }

/* ---------- shared bits ---------- */
.av { border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-family: var(--body); flex-shrink: 0;
  box-shadow: 0 14px 30px -12px rgba(0,0,0,.5); }

/* the thread: one swoosh that carries the conversation across the seam */
svg.thread { position: absolute; inset: 0; width: 2160px; height: 1920px; pointer-events: none; }

/* typing pill riding the swoosh across the seam (no text, safe on the seam) */
.pill { position: absolute; left: 920px; top: 1190px; width: 320px; height: 128px; border-radius: 64px;
  background: var(--paper); transform: rotate(-40deg); display: flex; align-items: center; justify-content: center; gap: 18px;
  box-shadow: 0 30px 60px -24px rgba(0,0,0,.55); }
.pill i { width: 28px; height: 28px; border-radius: 50%; background: var(--matcha-deep); opacity: .4; }
.pill i:nth-child(2) { opacity: .75; transform: translateY(-7px); }
.pill i:nth-child(3) { opacity: 1; }

.early { left: 96px; top: 1540px; width: 800px; }
/* ---------- right half ---------- */
.r { position: absolute; display: flex; gap: 18px; align-items: flex-start; }
.r .av { width: 96px; height: 96px; font-size: 42px; margin-top: 44px; border: 5px solid rgba(244,241,232,.9); }
.r .nm { font-family: var(--mono); font-size: 27px; letter-spacing: .05em; color: rgba(244,241,232,.9); margin: 0 0 10px 10px; }
.r .b { font-size: 44px; line-height: 1.2; font-weight: 500; padding: 26px 36px 30px;
  border-radius: 12px 40px 40px 40px; box-shadow: 0 30px 50px -24px rgba(0,0,0,.55); letter-spacing: -.3px; }
.react { position: absolute; background: var(--paper); color: var(--ink); border-radius: 999px; font-size: 32px; font-weight: 600;
  padding: 8px 20px; box-shadow: 0 12px 24px -10px rgba(0,0,0,.45); }

.hl-right { left: 1176px; top: 1520px; font-size: 172px; }
.pick { position: absolute; left: 1196px; top: 1716px; display: flex; align-items: center; gap: 18px;
  background: var(--matcha-light); color: var(--matcha-dark); border-radius: 26px; padding: 22px 34px;
  font-size: 40px; font-weight: 600; box-shadow: 0 24px 40px -20px rgba(0,0,0,.5); transform: rotate(-2deg); }
.pick .tick { width: 54px; height: 54px; border-radius: 50%; background: var(--matcha-deep); display: flex; align-items: center; justify-content: center; }

/* seam guide (debug only) */
.seam { position: absolute; left: 1079px; top: 0; width: 2px; height: 1920px; background: red; display: none; }
.debug .seam { display: block; }
</style>
</head>
<body>
<div id="spread">

  <svg class="thread" viewBox="0 0 2160 1920">
    <defs>
      <linearGradient id="sw" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#c8e6cc" stop-opacity="0"/>
        <stop offset=".18" stop-color="#c8e6cc" stop-opacity=".55"/>
        <stop offset=".6" stop-color="#c8e6cc" stop-opacity=".55"/>
        <stop offset="1" stop-color="#c8e6cc" stop-opacity=".1"/>
      </linearGradient>
    </defs>
    <!-- main ribbon: from the gang, up across the seam, into the replies -->
    <path id="ribbon" d="M 140 1400 C 560 1470, 900 1420, 1080 1250 C 1250 1090, 1170 640, 1220 80"
      fill="none" stroke="url(#sw)" stroke-width="40" stroke-linecap="round"/>
    <!-- echo line -->
    <path d="M 120 1470 C 600 1560, 960 1480, 1140 1300 C 1310 1130, 1240 640, 1300 40"
      fill="none" stroke="#F4F1E8" stroke-opacity=".28" stroke-width="5" stroke-dasharray="2 22" stroke-linecap="round"/>
    <!-- motion ticks off the dilemma bubble -->
    <g stroke="#c8e6cc" stroke-width="8" stroke-linecap="round" opacity=".8">
      <path d="M 975 770 l 40 -38"/><path d="M 995 826 l 56 -12"/><path d="M 990 882 l 44 18"/>
    </g>
  </svg>

  <!-- LEFT -->
  <div class="logo">
    <svg width="46" height="57" viewBox="0 0 52 64" fill="none"><path d="M6 8 L4 52 Q4 60 12 60 L32 60 Q40 60 40 52 L38 8 Z" fill="#c8e6cc"/><path d="M38 18 Q50 18 50 32 Q50 44 40 44" stroke="#c8e6cc" stroke-width="4" fill="none" stroke-linecap="round"/><text x="21" y="44" text-anchor="middle" fill="#3E7A50" font-weight="800" font-size="32" font-family="sans-serif">X</text></svg>
    <span>macha<em>X</em></span>
  </div>
  <div class="hl hl-left"><span class="num">7</span> AI friends.<br><span class="num">1</span> dilemma.</div>
  <div class="kicker">your AI group chat</div>

  <div class="you">
    <div class="who">you</div>
    <div class="b">should i move out or keep saving?</div>
  </div>

  <div class="gang" id="gang"></div>
  <div class="typing-note"><span class="dots"><i></i><i></i><i></i></span>7 friends typing</div>

  <div class="r early" id="early" style="transform:rotate(2deg)"></div>

  <div class="pill"><i></i><i></i><i></i></div>

  <!-- RIGHT -->
  <div id="replies"></div>

  <div class="hl hl-right">You pick<br>the move.</div>
  <div class="pick" style="display:none"></div>

  <div class="seam"></div>
</div>

<script>
// persona colours from src/lib/friends.ts (same as v1 screens.html)
const F = {
  reeva:   { c: "#6BAE7E", bg: "#DCEBD8", ink: "#2D5438" },
  aarushi: { c: "#D28AA8", bg: "#F4DCE5", ink: "#7A3855" },
  noor:    { c: "#5FA6B8", bg: "#CFE3E9", ink: "#204751" },
  tanmay:  { c: "#7A8BD4", bg: "#DDE1F3", ink: "#2E3B78" },
  dev:     { c: "#E2A34A", bg: "#F5E3C2", ink: "#7A4F14" },
  mira:    { c: "#C87560", bg: "#EFD4C9", ink: "#6E2F1F" },
  arjun:   { c: "hsl(200,45%,55%)", bg: "hsl(200,30%,92%)", ink: "hsl(200,40%,25%)" },
};
const av = (n, extra = "") => `<div class="av" style="background:${F[n].c};${extra}">${n[0].toUpperCase()}</div>`;

document.getElementById("gang").innerHTML =
  ["noor", "dev", "mira", "aarushi", "tanmay", "reeva", "arjun"].map(n => av(n)).join("");

// replies erupting on the right half; x,y are absolute in the 2160 canvas, rot in deg
const R = [
  { n: "noor",    t: "rent is 38% of your pay. save 6 more months.", x: 1170, y: 70,   w: 820, rot: -2.5 },
  { n: "dev",     t: "move out. learn to cook dal. growth", x: 1200, y: 390, w: 800, rot: 2.5 },
  { n: "mira",    t: "you said this last diwali too", x: 1186, y: 700, w: 640, rot: -3.5 },
  { n: "tanmay",  t: "but what if the flatmate snores", x: 1230, y: 960, w: 760, rot: 2 },
  { n: "aarushi", t: "what does your gut say?", x: 1200, y: 1230, w: 700, rot: -1.5 },
];
document.getElementById("replies").innerHTML = R.map(r => `
  <div class="r" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;transform:rotate(${r.rot}deg)">
    ${av(r.n)}
    <div><div class="nm">${r.n}</div><div class="b" style="background:${F[r.n].bg};color:${F[r.n].ink}">${r.t}</div></div>
  </div>`).join("") ;
// one reply already landing on the left half, so the eruption starts before the seam
document.getElementById("replies").innerHTML +=
  `<div class="react" style="left:1860px;top:800px;transform:rotate(10deg);font-size:64px;padding:10px 26px;background:${F.mira.bg}">💀</div>`;
document.getElementById("early").innerHTML = `${av("reeva")}<div><div class="nm">reeva</div><div class="b" style="background:${F.reeva.bg};color:${F.reeva.ink}">your commute drops by 2 hours a day. just saying</div></div>`;
</script>
</body>
</html>
